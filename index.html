<style>
:root{--paper:#f7efec;--ink:#2a1f22;--muted:#86737a;--pink:#c9476f;--grass:#816449}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Newsreader',Georgia,serif;font-size:19px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.hand{font-family:'Caveat',cursive;color:var(--pink);font-weight:500}

/* the photo */
.scene{position:relative;height:100svh;min-height:560px;overflow:hidden;background:linear-gradient(to bottom,var(--grass) 0%,var(--grass) 70%,var(--paper) 100%)}
.photo{position:absolute;left:50%;bottom:3svh;width:max(100%,calc(97svh * 0.995));aspect-ratio:1923/1933;transform:translateX(-50%)}
.photo img{position:absolute;inset:0;width:100%;height:100%;display:block;animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.035)}}
.photo::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:5%;background:linear-gradient(to bottom,rgba(129,100,73,0),var(--grass))}
.photo::before{content:"";position:absolute;left:0;right:0;top:0;height:30%;background:linear-gradient(to bottom,rgba(60,15,30,.28),rgba(60,15,30,0));z-index:1}
.title{position:absolute;left:0;right:0;top:16svh;text-align:center;z-index:3;padding:0 16px;font-family:'Caveat',cursive;font-weight:700;color:#fff;font-size:clamp(2.3rem,9.5vw,4.6rem);line-height:1;text-shadow:0 2px 18px rgba(90,20,45,.55),0 1px 2px rgba(90,20,45,.35);transform:rotate(-3deg)}
.label{position:absolute;left:35.5%;top:86%;z-index:3;font-family:'Caveat',cursive;font-weight:700;color:#fff;font-size:clamp(1.6rem,6vw,2.2rem);line-height:1;text-shadow:0 2px 12px rgba(40,25,10,.7)}
.label svg{position:absolute;left:-26px;top:6px;width:26px;height:22px;overflow:visible}
.fall{position:absolute;top:-30px;pointer-events:none;z-index:2;animation:fall linear infinite}
@keyframes fall{
  0%{transform:translate(0,0) rotate(0)}
  50%{transform:translate(var(--d),55svh) rotate(160deg)}
  100%{transform:translate(0,110svh) rotate(320deg)}
}

/* note */
main{max-width:540px;margin:0 auto;padding:80px 24px 40px}
main p+p{margin-top:1em}
.greet{font-style:italic;font-weight:300;font-size:2.6rem;line-height:1;margin-bottom:26px}
.note-love{font-size:2rem;margin-top:36px;display:inline-block;transform:rotate(-3deg)}
.sig{font-size:1.5rem;margin-top:6px}

/* the lines */
.lines{text-align:center;padding:50px 20px 20px}
.lines p{font-family:'Caveat',cursive;color:var(--pink);font-size:1.5rem;line-height:1.35;opacity:var(--o);transform:rotate(var(--r)) translateX(var(--x))}
footer{text-align:center;padding:30px 20px 60px;font-size:.85rem;color:var(--muted);font-style:italic}

.tap-love{position:fixed;pointer-events:none;z-index:9;font-family:'Caveat',cursive;font-size:1.6rem;font-weight:600;color:var(--pink);white-space:nowrap;transform:translate(-50%,-50%) rotate(-4deg);animation:rise 1.8s ease-out forwards;text-shadow:0 0 10px rgba(255,255,255,.8)}
@keyframes rise{to{transform:translate(-50%,-150%) rotate(-4deg);opacity:0}}
.fade{opacity:0;transform:translateY(14px);transition:opacity 1s ease,transform 1s ease}
.fade.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .photo img,.fall{animation:none}
  .fall{display:none}
  .fade{opacity:1;transform:none;transition:none}
}
</style>

<main>
  <p class="greet fade">Kookie,</p>
  <p class="fade">that tiny girl is you. That whole tree is my love for you. It's so much bigger than you can see from where you're standing, and it keeps growing.</p>
  <p class="hand note-love fade">love you so much si</p>
  <p class="hand sig fade">— <span data-you></span></p>
</main>

<div class="lines" id="lines" aria-hidden="true"></div>
<footer>for kookie, from doogie · love you so much si</footer>

<script>
const CONFIG = { yourName: "doogie" };
const LOVE = "love you so much si";
document.querySelectorAll("[data-you]").forEach(e => e.textContent = CONFIG.yourName);

// falling blossom petals
const scene = document.getElementById("scene");
const colors = ["#f3a6c0", "#e77fa2", "#f8c7d6", "#d9628a"];
for (let i = 0; i < 22; i++) {
  const d = document.createElement("div");
  d.className = "fall";
  const size = 6 + Math.random() * 8;
  const heart = i % 4 === 0;
  d.innerHTML = heart
    ? `<svg width="${size + 4}" height="${size + 4}" viewBox="-5 -2 10 11"><path fill="${colors[i % 4]}" d="M0 3C0 0-4-1-4 2C-4 4.5 0 6 0 8C0 6 4 4.5 4 2C4-1 0 0 0 3Z"/></svg>`
    : `<svg width="${size}" height="${size * 1.3}" viewBox="0 0 10 13"><path d="M5 0C9 3 10 9 5 13C0 9 1 3 5 0Z" fill="${colors[i % 4]}" opacity=".9"/></svg>`;
  d.style.left = Math.random() * 100 + "%";
  d.style.setProperty("--d", (Math.random() * 70 - 35).toFixed(0) + "px");
  d.style.animationDuration = (9 + Math.random() * 10).toFixed(1) + "s";
  d.style.animationDelay = (-Math.random() * 19).toFixed(1) + "s";
  scene.appendChild(d);
}

// love you so much si, over and over
const lines = document.getElementById("lines");
for (let i = 0; i < 22; i++) {
  const p = document.createElement("p");
  p.textContent = LOVE;
  p.style.setProperty("--o", (0.15 + (i / 21) * 0.85).toFixed(2));
  p.style.setProperty("--r", (Math.random() * 3 - 1.5).toFixed(2) + "deg");
  p.style.setProperty("--x", (Math.random() * 24 - 12).toFixed(0) + "px");
  lines.appendChild(p);
}

// tap anywhere
document.addEventListener("click", e => {
  const s = document.createElement("span");
  s.className = "tap-love";
  s.textContent = LOVE;
  s.style.left = e.clientX + "px"; s.style.top = e.clientY + "px";
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 1900);
});

// fade in
const io = new IntersectionObserver(es => es.forEach(en => {
  if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
}), { threshold: 0.15 });
document.querySelectorAll(".fade").forEach(el => io.observe(el));
</script>
